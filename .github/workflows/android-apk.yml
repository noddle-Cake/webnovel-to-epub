name: Android APK

on:
  pull_request:
    branches: [master]
    paths: ['flutter_app/**', '.github/workflows/android-apk.yml']
  push:
    branches: [master]
    paths: ['flutter_app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: Build downloadable debug APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          flutter build apk --debug --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define="API_BASE_URL=$API_BASE_URL"
      - name: Prepare download and checksum
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/chapter-and-verse.apk
          cd dist
          sha256sum chapter-and-verse.apk > chapter-and-verse.apk.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          path: flutter_app/dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-apk
          path: dist
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="android-build-$GITHUB_RUN_NUMBER"
          cat > release-notes.md <<EOF
          ## Download
          Download **chapter-and-verse.apk** below and install it on your Android device.
          This is a universal **debug APK** for direct testing, not an app-store release.
          Build machines use different debug keys, so uninstall a previous build if Android rejects an update.

          ## Connect your server
          The APK is the Flutter client; the Python extraction API must run separately.
          Open **Server connection** in the app and enter your API address (for example, http://192.168.1.10:8000 on your local network).
          See the [setup instructions](https://github.com/$GH_REPO/blob/$GITHUB_SHA/README.md).

          Built from commit $GITHUB_SHA. The SHA-256 checksum is attached.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" \
              --title "Chapter & Verse — Android debug build $GITHUB_RUN_NUMBER" \
              --notes-file release-notes.md --latest
          fi
